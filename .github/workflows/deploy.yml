name: Test and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: emergency-teams-coordinator-production
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Test backend
        working-directory: backend
        env:
          DJANGO_SECRET_KEY: ci-only-secret
          DJANGO_DEBUG: "false"
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python manage.py check
          python manage.py test

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Prepare SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          : "${SSH_PRIVATE_KEY:?Missing required SSH_PRIVATE_KEY production secret}"
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keygen -y -f ~/.ssh/deploy_key >/dev/null

      - name: Deploy over SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          set -euo pipefail
          : "${SSH_HOST:?Missing required SSH_HOST production secret}"
          : "${SSH_USER:?Missing required SSH_USER production secret}"
          SSH_PORT="${SSH_PORT:-22}"
          [[ "$SSH_PORT" =~ ^[0-9]+$ ]]

          DEPLOY_HOST="$SSH_HOST"
          if [[ ! "$DEPLOY_HOST" =~ ^[0-9]{1,3}(\.[0-9]{1,3}){3}$ ]]; then
            DEPLOY_HOST="$(getent ahostsv4 "$SSH_HOST" | awk 'NR==1 {print $1}')"
          fi
          : "${DEPLOY_HOST:?Could not resolve an IPv4 address for SSH_HOST}"
          echo "Deploying through IPv4: $DEPLOY_HOST:$SSH_PORT"

          SSH_OPTS=(
            -o BatchMode=yes
            -o StrictHostKeyChecking=accept-new
            -o AddressFamily=inet
            -o IdentitiesOnly=yes
            -o PreferredAuthentications=publickey
            -o ConnectTimeout=15
            -o ConnectionAttempts=1
            -o ServerAliveInterval=15
            -o ServerAliveCountMax=3
            -o TCPKeepAlive=yes
            -i ~/.ssh/deploy_key
            -p "$SSH_PORT"
          )

          for attempt in $(seq 1 10); do
            if ssh "${SSH_OPTS[@]}" "$SSH_USER@$DEPLOY_HOST" "echo SSH_OK"; then
              break
            fi
            if [ "$attempt" = 10 ]; then
              echo "SSH preflight failed after 10 attempts. The VPS was not reachable from this GitHub runner."
              exit 1
            fi
            echo "SSH preflight attempt $attempt/10 failed; retrying..."
            sleep $((attempt * 6))
          done

          ssh "${SSH_OPTS[@]}" "$SSH_USER@$DEPLOY_HOST" "FORCE_DEPLOY=1 bash -s" <<'REMOTE_SCRIPT'
          set -euo pipefail

          APP_DIR=/opt/emergency-teams-coordinator
          [ -d "$APP_DIR" ]

          exec 9>/var/lock/emergency-teams-coordinator-deploy.lock
          flock -w 300 9

          cd "$APP_DIR"
          bash deploy/deploy.sh

          READY=0
          for i in $(seq 1 60); do
            HEALTH="$(docker compose ps --format '{{.Health}}' backend 2>/dev/null || true)"
            if [ "$HEALTH" = "healthy" ]; then
              READY=1
              break
            fi
            sleep 3
          done

          if [ "$READY" -ne 1 ]; then
            echo "Backend did not become healthy in time."
            docker compose ps || true
            docker compose logs --tail 100 backend || true
            exit 1
          fi

          echo "Deployment completed"
          REMOTE_SCRIPT
